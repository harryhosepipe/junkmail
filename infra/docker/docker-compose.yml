services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api-dev
      - web-dev
      - convex-backend
      - minio

  repo-deps:
    image: oven/bun:1
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../:/app
    command: sh -lc "bun install"
    restart: "no"

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    env_file:
      - ../../.env.local
    environment:
      # Used for generating URLs in Convex responses/UI.
      CONVEX_CLOUD_ORIGIN: http://convex.localhost
      CONVEX_SITE_ORIGIN: http://convex-site.localhost
      DO_NOT_REQUIRE_SSL: "1"
    volumes:
      - convex_data:/convex/data

  convex-dev:
    image: node:22-bookworm-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../:/app
    env_file:
      - ../../.env.local
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
    command: >
      sh -lc "./node_modules/.bin/convex dev
      --url \"$$CONVEX_SELF_HOSTED_URL\"
      --admin-key \"$$CONVEX_SELF_HOSTED_ADMIN_KEY\""
    depends_on:
      repo-deps:
        condition: service_completed_successfully
      convex-backend:
        condition: service_started

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://convex.localhost
    depends_on:
      - convex-backend
    ports:
      - "6792:6791"

  api-dev:
    image: node:22-bookworm-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../:/app
    env_file:
      - ../../.env.defaults
      - ../../.env.local
    command: sh -lc "cd api && ../node_modules/.bin/tsx watch src/index.ts"
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://junkmail:junkmail@postgres:5432/junkmail
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://minio.localhost
      WEB_BASE_URL: http://web.localhost
      API_BASE_URL: http://web.localhost
      PUBLIC_API_BASE_URL: http://web.localhost
      CORS_ORIGIN: http://web.localhost
      CONVEX_URL: http://convex-backend:3210
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
    depends_on:
      repo-deps:
        condition: service_completed_successfully
      convex-backend:
        condition: service_started
      convex-dev:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  web-dev:
    image: node:22-bookworm-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../:/app
    env_file:
      - ../../.env.defaults
      - ../../.env.local
    command: sh -lc "cd web && ../node_modules/.bin/astro dev --host 0.0.0.0 --port 4321"
    environment:
      API_BASE_URL: http://api-dev:8787
      PUBLIC_API_BASE_URL: http://web.localhost
      PUBLIC_CONVEX_URL: http://convex.localhost
    depends_on:
      repo-deps:
        condition: service_completed_successfully
      api-dev:
        condition: service_started

  worker-dev:
    image: node:22-bookworm-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../:/app
    env_file:
      - ../../.env.defaults
      - ../../.env.local
    command: sh -lc "cd api && ../node_modules/.bin/tsx watch src/queue/worker.ts"
    environment:
      DATABASE_URL: postgres://junkmail:junkmail@postgres:5432/junkmail
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://minio.localhost
      WEB_BASE_URL: http://web.localhost
      API_BASE_URL: http://web.localhost
      PUBLIC_API_BASE_URL: http://web.localhost
      CORS_ORIGIN: http://web.localhost
      CONVEX_URL: http://convex-backend:3210
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
    depends_on:
      repo-deps:
        condition: service_completed_successfully
      convex-backend:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: junkmail
      POSTGRES_PASSWORD: junkmail
      POSTGRES_DB: junkmail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/junkmail || true;
      mc anonymous set download local/junkmail || true;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  convex_data:
