services:
  caddy:
    image: caddy:2-alpine
    profiles: ["host"]
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # Allow reverse_proxy to reach host-run dev servers on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # On WSL2 + Docker Desktop, host.docker.internal may not route to the WSL VM.
      # Allow overriding with a WSL IP via DEV_UPSTREAM_HOST.
      WEB_UPSTREAM: ${DEV_UPSTREAM_HOST:-host.docker.internal}:4321
      API_UPSTREAM: ${DEV_UPSTREAM_HOST:-host.docker.internal}:8787
      MINIO_UPSTREAM: minio:9000
      MINIO_CONSOLE_UPSTREAM: minio:9001
      CONVEX_UPSTREAM: convex-backend:3210
      CONVEX_SITE_UPSTREAM: convex-backend:3211
    depends_on:
      - convex-backend
      - minio

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    env_file:
      - ../../.env.local
    environment:
      # Used for generating URLs in Convex responses/UI.
      CONVEX_CLOUD_ORIGIN: http://convex.localhost
      CONVEX_SITE_ORIGIN: http://convex-site.localhost
      DO_NOT_REQUIRE_SSL: "1"
    volumes:
      - convex_data:/convex/data
    ports:
      - "3210:3210"
      - "3211:3211"

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://convex.localhost
    depends_on:
      - convex-backend
    ports:
      - "6791:6791"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: junkmail
      POSTGRES_PASSWORD: junkmail
      POSTGRES_DB: junkmail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/junkmail || true;
      mc anonymous set download local/junkmail || true;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  convex_data:
