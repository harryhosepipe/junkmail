services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: junkmail
      POSTGRES_PASSWORD: junkmail
      POSTGRES_DB: junkmail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/junkmail || true;
      mc anonymous set download local/junkmail || true;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
